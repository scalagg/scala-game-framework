# Docker Development Configuration
# Optimized for local development with Docker

# Redis Configuration
redis {
    host = "localhost"
    port = 6379
    password = ""
    database = 0
    timeout = 5000
    pool {
        max-total = 10
        max-idle = 5
        min-idle = 2
    }
}

# Deployment Strategy Configuration
deployment {
    strategy = "docker"
    auto-scaling = true
    max-instances = 20
    # Game-specific scaling limits (lower for development)
    scaling {
        bedwars {
            min-instances = 1
            max-instances = 5
            scale-up-threshold = 0.8
            scale-down-threshold = 0.3
        }
        skywars {
            min-instances = 1
            max-instances = 3
            scale-up-threshold = 0.7
            scale-down-threshold = 0.2
        }
        duels {
            min-instances = 1
            max-instances = 2
            scale-up-threshold = 0.9
            scale-down-threshold = 0.1
        }
    }
}

# Docker Configuration
docker {
    network-name = "minigames-dev-network"
    compose-directory = "/tmp/docker-compose-dev"
    data-directory = "/tmp/minigames-data"
    daemon {
        socket = "unix:///var/run/docker.sock"
        timeout = 30000
    }
}

# Game Server Configuration
game-servers {
    default-image = "minecraft-server:dev"
    images {
        bedwars = "bedwars-server:dev"
        skywars = "skywars-server:dev"
        duels = "duels-server:dev"
    }
    default-resources {
        cpu = "250m"
        memory = "512Mi"
        storage = "1Gi"
    }
    resources {
        bedwars {
            cpu = "500m"
            memory = "1Gi"
            storage = "2Gi"
        }
        skywars {
            cpu = "250m"
            memory = "512Mi"
            storage = "1Gi"
        }
        duels {
            cpu = "100m"
            memory = "256Mi"
            storage = "512Mi"
        }
    }
    ports {
        start-port = 25565
        end-port = 25585
        increment = 1
    }
}

# Queue Configuration
queue {
    matchmaking {
        max-wait-time = 60000  # 1 minute for development
        ping-threshold = 200
        elo-threshold = 300
    }
    processing {
        interval = 2000  # Process every 2 seconds
        batch-size = 5
    }
}

# Monitoring Configuration
monitoring {
    status-timeout = 5000  # Longer timeout for development
    health-check-interval = 5000
    leaderboard-update-interval = 60000
    metrics {
        enabled = true
        collection-interval = 30000  # 30 seconds
        retention-days = 1
    }
}

# Logging Configuration
logging {
    level = "DEBUG"  # More verbose logging for development
    pattern = "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file {
        enabled = true
        path = "/tmp/minigames-logs"
        max-size = "50MB"
        max-files = 5
    }
    console {
        enabled = true
        colored = true
    }
}

# Security Configuration (relaxed for development)
security {
    api {
        enabled = false
        token = ""
        rate-limit = 10000
    }
    network {
        allowed-ips = ["127.0.0.1", "::1", "0.0.0.0/0"]
        blocked-ips = []
    }
}

# Performance Configuration (optimized for development)
performance {
    threads {
        core-pool-size = 2
        max-pool-size = 8
        queue-capacity = 100
    }
    memory {
        heap-size = "1G"
        gc-type = "G1GC"
    }
}
