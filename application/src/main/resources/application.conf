# Minigames Manager Application Configuration
# This configuration supports both Docker and Kubernetes deployment strategies

# Redis Configuration
redis {
    host = "localhost"
    port = 6379
    password = ""
    database = 0
    timeout = 5000
    pool {
        max-total = 20
        max-idle = 10
        min-idle = 5
    }
}

# Deployment Strategy Configuration
deployment {
    strategy = "docker"  # Options: "kubernetes", "docker"
    auto-scaling = true
    max-instances = 100
    # Game-specific scaling limits
    scaling {
        bedwars {
            min-instances = 2
            max-instances = 20
            scale-up-threshold = 0.8  # Scale up when 80% capacity
            scale-down-threshold = 0.3  # Scale down when 30% capacity
        }
        skywars {
            min-instances = 1
            max-instances = 15
            scale-up-threshold = 0.7
            scale-down-threshold = 0.2
        }
        duels {
            min-instances = 1
            max-instances = 10
            scale-up-threshold = 0.9
            scale-down-threshold = 0.1
        }
    }
}

# Kubernetes Configuration (only used when strategy = "kubernetes")
kubernetes {
    namespace = "default"
    config-path = ""  # Leave empty to use default kubeconfig
    # Resource quotas
    resource-quotas {
        cpu = "10"
        memory = "20Gi"
        storage = "100Gi"
    }
}

# Docker Configuration (only used when strategy = "docker")
docker {
    network-name = "minigames-network"
    compose-directory = "/tmp/docker-compose"
    data-directory = "/var/lib/minigames"
    # Docker daemon settings
    daemon {
        socket = "unix:///var/run/docker.sock"
        timeout = 30000  # milliseconds
    }
}

# Game Server Configuration
game-servers {
    default-image = "minecraft-server:latest"
    # Game-specific images
    images {
        bedwars = "bedwars-server:latest"
        skywars = "skywars-server:latest"
        duels = "duels-server:latest"
    }
    # Default resource limits
    default-resources {
        cpu = "500m"
        memory = "1Gi"
        storage = "2Gi"
    }
    # Game-specific resource limits
    resources {
        bedwars {
            cpu = "1"
            memory = "2Gi"
            storage = "3Gi"
        }
        skywars {
            cpu = "750m"
            memory = "1.5Gi"
            storage = "2Gi"
        }
        duels {
            cpu = "250m"
            memory = "512Mi"
            storage = "1Gi"
        }
    }
    # Port configuration
    ports {
        start-port = 25565
        end-port = 25665
        increment = 1
    }
}

# Queue Configuration
queue {
    # Matchmaking settings
    matchmaking {
        max-wait-time = 300000  # 5 minutes in milliseconds
        ping-threshold = 150    # Maximum ping in milliseconds
        elo-threshold = 200     # Maximum ELO difference
    }
    # Queue processing
    processing {
        interval = 1000        # Process queues every 1 second
        batch-size = 10        # Process up to 10 matches per batch
    }
}

# Monitoring Configuration
monitoring {
    status-timeout = 2000  # milliseconds
    health-check-interval = 1000  # milliseconds
    leaderboard-update-interval = 30000  # milliseconds
    # Metrics collection
    metrics {
        enabled = true
        collection-interval = 60000  # 1 minute
        retention-days = 7
    }
}

# Logging Configuration
logging {
    level = "INFO"
    pattern = "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    # File logging
    file {
        enabled = true
        path = "/var/log/minigames-manager"
        max-size = "100MB"
        max-files = 10
    }
    # Console logging
    console {
        enabled = true
        colored = true
    }
}

# Security Configuration
security {
    # API authentication
    api {
        enabled = false
        token = ""
        rate-limit = 1000  # requests per minute
    }
    # Network security
    network {
        allowed-ips = ["127.0.0.1", "::1"]
        blocked-ips = []
    }
}

# Performance Configuration
performance {
    # Thread pool settings
    threads {
        core-pool-size = 4
        max-pool-size = 16
        queue-capacity = 1000
    }
    # Memory settings
    memory {
        heap-size = "2G"
        gc-type = "G1GC"
    }
}
